      const line = L.polyline(route.points, {color: route.color, weight: 5, opacity: 0.9}).addTo(map);

      allBounds.push(...route.points);

      const problem = route.problems.length ? `<div class="warning">${route.problems.join('<br>')}</div>` : '';
