    const map = L.map('map', {preferCanvas: true});

    satellite.addTo(map);

    const allBounds = [];
    const layers = [];
    const list = document.getElementById('route-list');

    routes.forEach((route, index) => {
      if (!route.points.length) return;
      const line = L.polyline(route.points, {color: route.color, weight: 5, opacity: 0.9}).addTo(map);
      line.bindTooltip(route.label, {sticky: true});
      line.bindPopup(`<strong>${route.bag_name}</strong><br>Length: ${route.length}<br>Duration: ${route.duration}<br>GPS points: ${route.original_point_count.toLocaleString()}`);
      const start = L.circleMarker(route.points[0], {radius: 7, color: '#123', weight: 2, fillColor: '#2ca02c', fillOpacity: 1}).addTo(map).bindTooltip(`${route.label} start`);
      const end = L.circleMarker(route.points[route.points.length - 1], {radius: 7, color: '#123', weight: 2, fillColor: '#d62728', fillOpacity: 1}).addTo(map).bindTooltip(`${route.label} end`);
      layers.push({line, start, end});
      allBounds.push(...route.points);

      const div = document.createElement('div');
      div.className = 'route';
      const problem = route.problems.length ? `<div class="warning">${route.problems.join('<br>')}</div>` : '';
      const thinned = route.display_point_count !== route.original_point_count ? `<div>shown: ${route.display_point_count.toLocaleString()}</div>` : '';
      div.innerHTML = `<button type="button" aria-label="Zoom to ${route.label}"><span class="route-title"><span class="swatch" style="background:${route.color}"></span>${route.label}</span><span class="route-meta"><span>${route.length}</span><span>${route.duration}</span><span>${route.original_point_count.toLocaleString()} points</span>${thinned}</span>${problem}</button>`;
      div.querySelector('button').addEventListener('click', () => map.fitBounds(line.getBounds(), {padding: [28, 28]}));
      list.appendChild(div);
    });

    if (allBounds.length) {
